# Cassandra Local Configuration Example

provider = "google"
model = "gemini-3.6-flash"
main-guidelines = "general"

pre-review-model = "gemini-3.5-flash-lite"
pre-review-prompt = ".cassandra/pre-review-summary.md"

supplemental-guidelines = [
    ".cassandra/drive-by-fixes.md",
    ".cassandra/codify-patterns.md",
]
allow-url-fetch = true

provider-options-file = ".cassandra.google.provider.settings.json"

# T3 Code orchestration settings (applied when running inside T3 Code)
[t3]
# Priority list of coding agent harnesses to launch for code fixes
preferred-harnesses = ["antigravity", "opencode", "claudeAgent", "codex"]
# Preferred model tier or exact model (leave empty to pick provider's default model)
preferred-model = "gemini-3.8-flash-high"
# Prompt the developer via ask_developer to choose the harness/model if multiple are available
prompt-for-harness = true

