<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#1b1440" />
      <stop offset="100%" stop-color="#241442" />
    </linearGradient>

    <!-- Eye Lid Gradient -->
    <linearGradient id="eyeStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Corner / Border Subtle Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Background Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />

  <!-- Outer Foresight Halo Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="6 14" opacity="0.4" />

  <!-- Stylized Eye Outline (Cassandra's Vision) -->
  <path d="M 80 256 C 140 148, 372 148, 432 256 C 372 364, 140 364, 80 256 Z"
        fill="none"
        stroke="url(#eyeStrokeGrad)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Iris -->
  <circle cx="256" cy="256" r="82" fill="url(#irisGrad)" stroke="#c084fc" stroke-width="4" />

  <!-- Inner Iris Aperture / Tech Accent Lines -->
  <circle cx="256" cy="256" r="58" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Pupil (Deep Obsidian) -->
  <circle cx="256" cy="256" r="38" fill="#090514" />

  <!-- Radiant Core Glow -->
  <circle cx="256" cy="256" r="26" fill="url(#coreGlow)" />

  <!-- Prophetic Spark / Foresight Star Glint -->
  <polygon points="256,236 261,251 276,256 261,261 256,276 251,261 236,256 251,251" fill="#ffffff" opacity="0.95" />

  <!-- Specular Reflection Highlight -->
  <circle cx="274" cy="238" r="8" fill="#ffffff" opacity="0.8" />
  <circle cx="284" cy="246" r="3.5" fill="#ffffff" opacity="0.5" />
</svg>
