name: Run Evaluations
on:
  push:
    branches:
      - main
    paths:
      - 'core/eval/testdata/**'
      - 'scripts/run_evals.sh'
      - '.github/workflows/run_evals.yml'
  workflow_dispatch:
    inputs:
      id:
        description: 'Evaluation ID (matches markers in EVALUATIONS.md)'
        required: false
        default: 'baseline'
      config:
        description: 'Path to Cassandra config'
        required: false
        default: 'cassandra.toml'
      repeats:
        description: 'Number of evaluation runs'
        required: false
        default: '5'
jobs:
  evaluate:
    name: Run and Report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      EVAL_ID: ${{ inputs.id || 'baseline' }}
      EVAL_CONFIG: ${{ inputs.config || 'cassandra.toml' }}
      EVAL_REPEATS: ${{ inputs.repeats || '5' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup Hermetiq
        uses: ./.github/actions/setup-hermetiq
        env:
          HERMETIQ_CRED_HELPER: ${{ secrets.HERMETIQ_CRED_HELPER }}
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Run Evaluations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./scripts/run_evals.sh \
            "$EVAL_ID" \
            "$EVAL_CONFIG" \
            "$GEMINI_API_KEY" \
            "google" \
            "gemini-3.8-flash" \
            "$GEMINI_API_KEY" \
            "$EVAL_REPEATS"
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 3562238
          private-key: ${{ secrets.CASSANDRA_APP_PRIVATE_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "docs: update evaluation results for '${{ env.EVAL_ID }}'"
          title: "Evaluation Results: ${{ env.EVAL_ID }}"
          body: "Automated evaluation results for configuration `${{ env.EVAL_CONFIG }}` using ID `${{ env.EVAL_ID }}`."
          branch: "eval-results/${{ env.EVAL_ID }}"
          labels: "skip-ai-review"
          base: main
          delete-branch: true
          add-paths: |
            core/eval/EVALUATIONS.md
            core/eval/results/*.json
